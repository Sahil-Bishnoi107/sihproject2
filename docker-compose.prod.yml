# Run the published image with a Postgres database:
#   docker compose -f docker-compose.prod.yml up -d      then open http://localhost:8080
name: sihproject2

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bidguard
      POSTGRES_USER: bidguard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidguard -d bidguard"]
      interval: 5s
      retries: 20

  app:
    image: sahilbishnoi1/sihproject2:latest
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Database: Host=db;Database=bidguard;Username=bidguard;Password=${DB_PASSWORD:-change-me}
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET to a random string of 32+ characters}
      # Demo accounts (admin@bidguard.local, officer@bidguard.local, bidder@shakti.local) are created on first start
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Seed__OfficerPassword: ${SEED_OFFICER_PASSWORD:-}
      Seed__BidderPassword: ${SEED_BIDDER_PASSWORD:-}
      Swagger__Enabled: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  uploads:
